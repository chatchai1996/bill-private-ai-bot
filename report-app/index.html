<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบแนบรูปเบิกจ่าย</title>
  <style>
    /* ========== โหมดหน้าจอมือถือ (Form Input) ========== */
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f2f5; margin: 0; padding: 15px; }
    .form-container { max-width: 500px; margin: auto; }
    h2 { text-align: center; color: #1a73e8; margin-bottom: 20px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .card-title { font-weight: bold; margin-bottom: 8px; color: #333; }
    textarea { width: 100%; border: 1px solid #ccc; border-radius: 8px; padding: 10px; font-size: 14px; resize: none; }
    .upload-btn { margin-top: 10px; display: block; width: 100%; }
    .preview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
    .preview-grid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
    .submit-btn { width: 100%; background: #1a73e8; color: #fff; font-size: 16px; font-weight: bold; border: none; padding: 14px; border-radius: 10px; cursor: pointer; }
    .submit-btn:disabled { background: #aaa; }

    /* ========== โหมดกด Print (A4 Output) ========== */
    @page { size: A4; margin: 15mm 12mm; }
    @media print {
      body { background: #fff; padding: 0; }
      .form-controls, .submit-btn, h2 { display: none !important; }
      .print-page { display: block !important; width: 100%; }
      .print-sec { margin-bottom: 20px; page-break-inside: avoid; }
      .print-title { font-size: 14pt; font-weight: bold; margin-bottom: 8px; color: #000; }
      .print-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .print-grid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border: 1px solid #666; border-radius: 4px; }
    }
  </style>
</head>
<body>

<div class="form-container form-controls">
  <h2>📋 บันทึกรูปเบิกจ่าย</h2>

  <div id="cards-container">
    <!-- วนสร้าง 4 การ์ด -->
  </div>

  <button class="submit-btn" id="btn-submit" onclick="submitToDrive()">🚀 Send to Google Drive</button>
  <div id="status" style="text-align:center; margin-top:15px; font-size:14px;"></div>
</div>

<script>
  // สร้าง 4 การ์ดอัตโนมัติ
  const container = document.getElementById('cards-container');
  for (let i = 1; i <= 4; i++) {
    container.innerHTML += `
      <div class="card">
        <div class="card-title">รายการที่ ${i}</div>
        <textarea id="text-${i}" rows="2" placeholder="ระบุรายละเอียดงาน..."></textarea>
        <input type="file" id="file-${i}" class="upload-btn" accept="image/*" multiple onchange="previewImages(${i})">
        <div class="preview-grid" id="preview-${i}"></div>
      </div>
    `;
  }

  const imagesData = { 1: [], 2: [], 3: [], 4: [] };

  function previewImages(index) {
    const input = document.getElementById(`file-${index}`);
    const preview = document.getElementById(`preview-${index}`);
    preview.innerHTML = '';
    imagesData[index] = [];

    const files = Array.from(input.files).slice(0, 4); // ไม่เกิน 4 รูป
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (e) => {
        imagesData[index].push(e.target.result);
        const img = document.createElement('img');
        img.src = e.target.result;
        preview.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  }

  async function submitToDrive() {
    const btn = document.getElementById('btn-submit');
    const status = document.getElementById('status');
    btn.disabled = true;
    status.innerText = "⏳ กำลังบันทึกไฟล์และส่งเข้า Google Drive...";

    const payload = [];
    for (let i = 1; i <= 4; i++) {
      const text = document.getElementById(`text-${i}`).value.trim();
      const imgs = imagesData[i];
      if (text || imgs.length > 0) {
        payload.push({ title: text || `รายการที่ ${i}`, images: imgs });
      }
    }

    if (payload.length === 0) {
      status.innerText = "⚠️ กรุณากรอกข้อมูลอย่างน้อย 1 รายการ";
      btn.disabled = false;
      return;
    }

    try {
      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: payload })
      });
      const data = await res.json();
      if (data.success) {
        status.innerHTML = `✅ บันทึกสำเร็จ! <br><a href="${data.url}" target="_blank">👉 เปิดไฟล์บน Google Drive เพื่อกดพิมพ์</a>`;
      } else {
        status.innerText = `❌ เกิดข้อผิดพลาด: ${data.error}`;
      }
    } catch (err) {
      status.innerText = `❌ Error: ${err.message}`;
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
